<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wikra P0 增量交互高保真原型</title>
  <link rel="stylesheet" href="./styles.css">
  <style>
    /* ========================================================================
       Wikra P0 Incremental Styles (100% inheriting styles.css Slate/Paper tokens)
       Zero CDN, zero decorative gradients, zero emoji.
       ======================================================================== */
    body {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      background: var(--canvas);
    }

    /* Prototype Review Topbar */
    .p0-bar {
      flex: none;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 14px;
      background: var(--inset);
      border-bottom: 1px solid var(--line-subtle);
    }
    .p0-bar-left {
      display: flex;
      align-items: center;
      gap: 9px;
      flex: none;
    }
    .p0-bar-tag {
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--accent-border);
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }
    .p0-scene-tabs {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 3px;
      border-radius: 6px;
      border: 1px solid var(--line-subtle);
      background: var(--surface);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .p0-scene-tabs::-webkit-scrollbar { display: none; }
    .p0-scene-tab {
      border: 1px solid transparent;
      border-radius: 4px;
      padding: 4px 10px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 550;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
    }
    .p0-scene-tab:hover { color: var(--text); background: var(--surface-raised); }
    .p0-scene-tab.active {
      background: var(--accent-soft);
      border-color: var(--accent-border);
      color: var(--accent);
      font-weight: 620;
    }
    .p0-bar-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: none;
    }

    /* Viewport Frame Wrapper (supports Full vs 1100x700 simulated laptop DPI check) */
    .p0-viewport-host {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: stretch;
      justify-content: center;
      background: var(--inset);
      overflow: auto;
    }
    .p0-viewport-host.narrow-mode {
      padding: 16px;
      align-items: flex-start;
    }
    .p0-app-frame {
      width: 100%;
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--canvas);
      overflow: hidden;
    }
    .p0-viewport-host.narrow-mode .p0-app-frame {
      width: 1100px;
      height: 700px;
      flex: none;
      border-radius: 10px;
      border: 1px solid var(--line-strong);
      box-shadow: var(--shadow-float);
    }

    /* Workspace Shell inside Frame */
    .p0-shell {
      flex: 1;
      min-height: 0;
      display: flex;
      overflow: hidden;
    }
    .p0-stage {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--canvas);
      container-type: inline-size;
      container-name: stage;
      overflow: hidden;
    }

    /* Small utility helpers */
    .btn.xs { min-height: 22px; padding: 2px 7px; font-size: 11.5px; }
    .btn.danger-outline {
      border-color: var(--error);
      color: var(--error);
      background: var(--error-soft);
    }
    .btn.danger-outline:hover:not(:disabled) {
      filter: brightness(1.06);
    }
    .hint { font-size: 12px; color: var(--muted); }
    .row-flex { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

    /* ========================================================================
       Scene 1: Organize & Lint Incremental Styles
       ======================================================================== */
    .ops-card-head { flex-wrap: wrap; }
    .ops-row { flex-wrap: wrap; }
    .ops-row-main { flex: 1 1 220px; }
    .ops-row-actions { flex-wrap: wrap; }
    .lint-filter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .lint-filter-pills {
      display: inline-flex;
      gap: 2px;
      padding: 3px;
      border-radius: 6px;
      background: var(--inset);
      border: 1px solid var(--line-subtle);
      flex-wrap: wrap;
    }
    .lint-filter-pills button {
      border: none;
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 11.5px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
    }
    .lint-filter-pills button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .lint-filter-pills button.active {
      background: var(--surface-active);
      color: var(--text);
      font-weight: 600;
    }
    .lint-page-filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      padding: 7px 10px;
      border-radius: 6px;
      border: 1px solid var(--accent-border);
      background: var(--accent-soft);
      font-size: 12px;
      color: var(--text);
    }
    .lint-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px 12px;
      flex-wrap: wrap;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid var(--line-subtle);
      background: var(--canvas);
    }
    .lint-row.sev-error { border-left: 3px solid var(--error); }
    .lint-row.sev-warn { border-left: 3px solid var(--warning); }
    .lint-row.sev-info { border-left: 3px solid var(--info); }
    .lint-row-main { min-width: 0; display: flex; flex-direction: column; gap: 4px; flex: 1 1 220px; }
    .lint-row-meta { font-size: 11.5px; color: var(--muted); font-family: "JetBrains Mono", monospace; word-break: break-all; }
    .lint-collapsed-note {
      font-size: 11.5px;
      color: var(--muted);
      padding: 4px 2px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    /* L2 Semantic Lint Trigger Footer inside Health Card */
    .l2-zone {
      margin-top: 6px;
      padding-top: 12px;
      border-top: 1px solid var(--line-subtle);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .l2-budget-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      padding: 9px 12px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: var(--inset);
      font-size: 12px;
    }
    .l2-result-card {
      padding: 11px 12px;
      border-radius: 6px;
      border: 1px solid var(--accent-border);
      background: var(--canvas);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .l2-quotes-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    @container stage (max-width: 680px) {
      .l2-quotes-grid { grid-template-columns: 1fr; }
    }
    .l2-quote-box {
      padding: 8px 10px;
      border-radius: 5px;
      border: 1px solid var(--line-subtle);
      background: var(--surface);
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* Multi-page Changeset Enhancements */
    .cs-card.highlighted {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent-border);
    }
    .cs-op-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px 8px;
      flex-wrap: wrap;
      padding: 3px 0;
      border-bottom: 1px solid var(--line-subtle);
    }
    .cs-op-row:last-child { border-bottom: none; }
    .cs-op-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1 1 200px;
      flex-wrap: wrap;
    }
    .cs-op-tag {
      font-size: 10.5px;
      font-weight: 650;
      padding: 1px 5px;
      border-radius: 3px;
      background: var(--surface-raised);
      border: 1px solid var(--line-subtle);
      color: var(--text-secondary);
      flex: none;
    }
    .cs-op-tag.create { color: var(--success); border-color: transparent; background: var(--success-soft); }
    .cs-op-tag.replace { color: var(--warning); border-color: transparent; background: var(--warning-soft); }
    .cs-op-tag.dropped { color: var(--muted); }
    .cs-gentle-note {
      padding: 6px 9px;
      border-radius: 5px;
      background: var(--info-soft);
      color: var(--text-secondary);
      font-size: 11.5px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .cs-revert-blocked {
      padding: 8px 10px;
      border-radius: 5px;
      border: 1px solid var(--warning);
      background: var(--warning-soft);
      color: var(--text);
      font-size: 12px;
      line-height: 1.5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .cs-rollback-feedback {
      padding: 8px 10px;
      border-radius: 5px;
      border: 1px solid var(--accent-border);
      background: var(--accent-soft);
      color: var(--text);
      font-size: 12px;
      line-height: 1.5;
    }

    /* Side-by-Side Pending Review Diff Modal */
    .diff-modal {
      width: min(1040px, 100%);
      max-height: 88dvh;
      border-radius: 10px;
      border: 1px solid var(--line-strong);
      background: var(--surface);
      box-shadow: var(--shadow-float);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      container-type: inline-size;
      container-name: diffmodal;
    }
    .diff-modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .diff-pane-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    @container diffmodal (max-width: 840px) {
      .diff-pane-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 860px) {
      .diff-pane-grid { grid-template-columns: 1fr; }
    }
    .diff-doc-col {
      border-radius: 7px;
      border: 1px solid var(--line);
      background: var(--inset);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .diff-doc-head {
      padding: 8px 12px;
      background: var(--surface-raised);
      border-bottom: 1px solid var(--line-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
    }
    .diff-code {
      padding: 10px 0;
      font-family: "JetBrains Mono", "Microsoft YaHei UI", monospace;
      font-size: 12px;
      line-height: 1.65;
      overflow-x: auto;
    }
    .diff-line {
      padding: 1px 12px;
      white-space: pre-wrap;
      word-break: break-word;
      display: flex;
      gap: 10px;
    }
    .diff-ln {
      width: 24px;
      flex: none;
      text-align: right;
      color: var(--muted);
      user-select: none;
      opacity: 0.7;
    }
    .diff-line.del { background: var(--error-soft); color: var(--text); }
    .diff-line.add { background: var(--success-soft); color: var(--text); }
    .diff-line.protect { background: var(--surface); color: var(--muted); border-left: 2px solid var(--success); }
    .version-conflict-bar {
      padding: 10px 13px;
      border-radius: 6px;
      border: 1px solid var(--error);
      background: var(--error-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 12.5px;
    }

    /* ========================================================================
       Scene 2: Settings Card 6 (External Agent MCP & SKILL.md)
       ======================================================================== */
    .settings-preview-stage {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px 36px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: var(--canvas);
    }
    .settings-modal-inline {
      width: min(820px, 100%);
      border-radius: 10px;
      border: 1px solid var(--line-strong);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .settings-collapsed-nav {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px dashed var(--line);
      background: var(--surface-raised);
      font-size: 12px;
      color: var(--muted);
    }
    .mcp-status-box {
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid var(--line-subtle);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .mcp-code-wrap {
      position: relative;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: var(--inset);
      overflow: hidden;
    }
    .mcp-code-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      border-bottom: 1px solid var(--line-subtle);
      background: var(--surface-raised);
      font-size: 11.5px;
      color: var(--muted);
    }
    .mcp-code-pre {
      margin: 0;
      padding: 11px 12px;
      font-size: 12px;
      line-height: 1.6;
      color: var(--text);
      overflow-x: auto;
      white-space: pre;
    }
    .skill-install-box {
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid var(--line-subtle);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      gap: 7px;
      font-size: 12px;
    }
    .skill-path-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      padding: 5px 8px;
      border-radius: 4px;
      background: var(--inset);
      border: 1px solid var(--line-subtle);
    }
    .skill-path-row .mono {
      word-break: break-all;
      min-width: 0;
    }
    .raw-allow-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    @container stage (max-width: 680px) {
      .raw-allow-list { grid-template-columns: 1fr; }
    }
    .raw-allow-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 9px 11px;
      border-radius: 6px;
      border: 1px solid var(--line-subtle);
      background: var(--surface);
      cursor: pointer;
      transition: border-color 0.12s ease, background 0.12s ease;
    }
    .raw-allow-item:hover { border-color: var(--line-strong); }
    .raw-allow-item.checked { border-color: var(--accent-border); background: var(--accent-soft); }
    .raw-allow-item input { margin-top: 3px; accent-color: var(--accent); cursor: pointer; }

    /* ========================================================================
       Scene 3: [[ / 【【 Autocomplete (540px Quick Capture + Main Source)
       ======================================================================== */
    .ac-showcase {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px 40px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
    }
    .ac-controls-bar {
      padding: 11px 14px;
      border-radius: 7px;
      border: 1px solid var(--line-subtle);
      background: var(--surface);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .ac-dual-grid {
      display: grid;
      grid-template-columns: 540px minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }
    @container stage (max-width: 1020px) {
      .ac-dual-grid { grid-template-columns: 1fr; }
    }
    .hud-540 {
      position: relative;
      width: 540px;
      max-width: 100%;
      height: 380px;
      border-radius: 10px;
      border: 1px solid var(--line-strong);
      background: var(--surface);
      box-shadow: var(--shadow-float);
      display: flex;
      flex-direction: column;
      overflow: visible;
    }
    .hud-540 > .hud-head {
      border-radius: 9px 9px 0 0;
      flex: none;
    }
    .hud-540 > .hud-foot {
      border-radius: 0 0 9px 9px;
      flex: none;
      flex-wrap: nowrap;
      gap: 8px;
      padding: 8px 12px;
      position: relative;
      z-index: 5;
    }
    .hud-foot-status {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .cm-sim-wrap {
      position: relative;
      background: var(--inset);
      min-height: 210px;
      padding: 14px 16px;
    }
    .hud-540 .cm-sim-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 12px 16px;
    }
    .cm-sim-textarea {
      width: 100%;
      min-height: 178px;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      font-family: "JetBrains Mono", "Microsoft YaHei UI", monospace;
      font-size: 13.5px;
      line-height: 1.72;
      resize: none;
    }
    .hud-540 .cm-sim-textarea {
      flex: 1;
      min-height: 0;
      height: 100%;
    }
    /* Styled CodeMirror 6 Autocomplete Popover */
    .cm-ac-popover {
      position: absolute;
      z-index: 30;
      width: 320px;
      max-width: calc(100% - 16px);
      border-radius: 7px;
      border: 1px solid var(--line-strong);
      background: var(--surface-raised);
      box-shadow: var(--shadow-float);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .hud-540 .cm-ac-popover {
      max-height: min(216px, calc(100vh - 110px));
    }
    .cm-ac-list {
      flex: 1;
      min-height: 0;
      max-height: 252px;
      overflow-y: auto;
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .cm-ac-option {
      width: 100%;
      text-align: left;
      border: 1px solid transparent;
      border-radius: 5px;
      background: transparent;
      padding: 6px 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .cm-ac-option:hover { background: var(--surface-active); }
    .cm-ac-option.active {
      background: var(--accent-soft);
      border-color: var(--accent-border);
    }
    .cm-ac-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .cm-ac-title {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .cm-ac-match {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .cm-ac-sub {
      font-size: 11px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .cm-ac-foot {
      padding: 5px 9px;
      border-top: 1px solid var(--line-subtle);
      background: var(--inset);
      font-size: 10.5px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .esc-chain-bar {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }
    @container stage (max-width: 780px) {
      .esc-chain-bar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    .esc-step {
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--line-subtle);
      background: var(--surface);
      font-size: 11.5px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .esc-step.active {
      border-color: var(--accent-border);
      background: var(--accent-soft);
    }

    /* ========================================================================
       Scene 4: WikiDocumentView Enhancements (Lint Badge, Disambig, Cite Hover)
       ======================================================================== */
    .lint-toolbar-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 26px;
      padding: 2px 9px;
      border-radius: 5px;
      border: 1px solid transparent;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: filter 0.12s ease;
    }
    .lint-toolbar-badge.warn {
      background: var(--warning-soft);
      border-color: var(--warning);
      color: var(--warning);
    }
    .lint-toolbar-badge.error {
      background: var(--error-soft);
      border-color: var(--error);
      color: var(--error);
    }
    .lint-toolbar-badge:hover { filter: brightness(1.08); }

    /* Anchored Disambiguation Popover */
    .inline-anchor-wrap {
      position: relative;
      display: inline-block;
    }
    .disambig-popover {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      z-index: 40;
      width: 316px;
      max-width: calc(100vw - 24px);
      border-radius: 7px;
      border: 1px solid var(--line-strong);
      background: var(--surface-raised);
      box-shadow: var(--shadow-float);
      overflow: hidden;
      text-align: left;

      // ======================================================================
      // Utilities
      // ======================================================================
      function esc(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function toast(msg) {
        const region = document.getElementById('toast-region');
        const el = document.createElement('div');
        el.className = 'toast';
        el.textContent = msg;
        region.appendChild(el);
        window.setTimeout(() => {
          el.remove();
        }, 3200);
      }

      function copyText(text, label) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(
            () => toast(`已复制${label}`),
            () => toast(`已选中${label}（预览环境请按 Ctrl+C 复制）`)
          );
        } else {
          toast(`已复制${label}`);
        }
      }

        themeBtn.textContent = state.theme === 'slate' ? '主题：深色 Slate' : '主题：浅色 Paper';

        const host = document.getElementById('viewport-host');
        host.classList.toggle('narrow-mode', state.narrow);
        document.getElementById('btn-viewport-toggle').textContent = state.narrow ? '视口：1100×700' : '视口：全宽';

        document.querySelectorAll('.p0-scene-tab').forEach((btn) => {
          const active = btn.dataset.scene === state.scene;
          btn.classList.toggle('active', active);
          btn.setAttribute('aria-selected', String(active));
        });
        document.querySelectorAll('.nav-item[data-rail-scene]').forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.railScene === state.scene);

        const totalPending = state.conflicts.filter((c) => c.status === 'open').length + state.pendingReviews.length;
        const badge = document.getElementById('rail-pending-badge');

        return { scope: effectiveScope, budget: l2Budgets[effectiveScope] };

      // ======================================================================
      // Scene 3: [[ / 【【 Autocomplete (540×380 Quick Capture + Main Source Mode)
      // ======================================================================
      function matchAutocomplete(text, cursorPos) {
        const pos = typeof cursorPos === 'number' ? Math.max(0, Math.min(cursorPos, text.length)) : text.length;
        const before = text.slice(0, pos);
        const after = text.slice(pos);
        const m = before.match(/(?:\[\[|【【)([^\]】\n]{0,40})$/);
        if (!m) return null;
        // 吸收光标后紧邻的成对闭合符 ]] 或 】】
        const closeMatch = after.match(/^(?:\]\]|】】)/);
        return {
          start: before.length - m[0].length,
          end: pos + (closeMatch ? closeMatch[0].length : 0),
          rawTrigger: m[0].startsWith('【【') ? '【【' : '[[',
          query: m[1].trim(),
          absorbedClosing: Boolean(closeMatch),
        };
      }

      function formatPickedLink(picked) {
        if (picked.matchedAlias) {
          // 重名文件 + 别名命中：[[folder/stem|alias]]；唯一文件 + 别名命中：[[stem|alias]]
          const target = picked.duplicate
            ? `${picked.folder.replace(/^wiki\//, '')}/${picked.stem}`
            : picked.stem;
          return `[[${target}|${picked.matchedAlias}]]`;
        }
        return picked.linkText;
      }

      function filterCandidates(query) {
        const q = query.toLowerCase();
        return state.acCandidates
          .map((c) => {
            const matchedAlias = q ? c.aliases.find((a) => a.toLowerCase().includes(q)) : null;
            const titleHit = !q || c.title.toLowerCase().includes(q) || c.stem.toLowerCase().includes(q);
            const pathHit = q && c.path.toLowerCase().includes(q);
            if (!titleHit && !matchedAlias && !pathHit) return null;
            return { ...c, matchedAlias };
          })
          .filter(Boolean)
          .slice(0, 7);
      }

      function highlightText(text, query) {
        if (!query) return esc(text);
        const idx = text.toLowerCase().indexOf(query.toLowerCase());
        if (idx < 0) return esc(text);
        return esc(text.slice(0, idx))
          + `<span class="cm-ac-match">${esc(text.slice(idx, idx + query.length))}</span>`
          + esc(text.slice(idx + query.length));
      }

      function renderAcPopoverHtml(candidates, activeIdx, query, scope, posStyle) {
        if (!candidates.length) return '';
        return `
          <div class="cm-ac-popover" style="${posStyle}" role="listbox" aria-label="知识页双链补全">
            <div class="cm-ac-list">
              ${candidates.map((c, idx) => {
                const sub = c.matchedAlias
                  ? `别名命中：${c.matchedAlias} · ${c.folder}`
                  : (c.duplicate ? `重名路径：${c.path}` : c.folder);
                return `
                  <button
                    type="button"
                    class="cm-ac-option ${idx === activeIdx ? 'active' : ''}"
                    role="option"
                    aria-selected="${idx === activeIdx}"
                    data-ac-pick="${scope}:${idx}"
                  >
                    <div class="cm-ac-top">
                      <span class="cm-ac-title">${highlightText(c.title, query)}</span>
                      <span class="pill ${c.typeLabel === '决策' ? 'accent' : ''}">${esc(c.typeLabel)}</span>
                    </div>
                    <span class="cm-ac-sub">${esc(sub)}</span>
                  </button>
                `;
              }).join('')}
            </div>
            <div class="cm-ac-foot">
              <span>↑↓ 选择 · Enter / Tab 插入</span>
              <span>Esc 仅关闭补全</span>
            </div>
          </div>
        `;
      }

      function renderAutocompleteScene() {
        const hudMatch = matchAutocomplete(state.hudText, state.hudCursor);
        const hudCands = hudMatch && !state.hudComposing && !state.hudAcDismissed
          ? filterCandidates(hudMatch.query)
          : [];
        const hudShow = hudCands.length > 0;
        if (state.hudAcActiveIdx >= hudCands.length) state.hudAcActiveIdx = 0;

              <span class="hint">采纳后将按原操作类型（${esc(pr.opTag)}）生成可单独撤销的子整理记录（关联批次 #${esc(pr.changesetId)}）</span>
              <div class="row-flex">
                ${pr.externallyModified ? '<button type="button" class="btn sm" id="btn-footer-manual-merge">打开页面手动合并</button>' : ''}
                <button type="button" class="btn sm" id="btn-discard-review">丢弃此页改动</button>

                  采纳写入
                </button>
              </div>
            </div>
          </div>
        `;
      }

      // Clamp floating popovers in Scene 4 horizontally within reading pane
      function clampFloatingPopovers() {
        const container = document.querySelector('.editor-main') || document.getElementById('stage-root');
        if (!container) return;
        const cRect = container.getBoundingClientRect();
        document.querySelectorAll('.disambig-popover, .cite-hover-card').forEach((pop) => {
          const pRect = pop.getBoundingClientRect();
          const pad = 12;
          let shiftX = 0;
          if (pRect.right > cRect.right - pad) shiftX = (cRect.right - pad) - pRect.right;
          if (pRect.left + shiftX < cRect.left + pad) shiftX += (cRect.left + pad) - (pRect.left + shiftX);
          if (shiftX !== 0) {
            const base = pop.classList.contains('cite-hover-card') ? 'translateX(-50%) ' : '';
            pop.style.transform = `${base}translateX(${Math.round(shiftX)}px)`;
          }
        });
      }

      // ======================================================================
      // Master Render + Event Wiring
      // ======================================================================
      function render() {
        if (state.scene === 'wikidoc') {
          state.l2ActiveDocTitle = state.docActiveTitle;
        }
        updateGlobalChrome();
        const root = document.getElementById('stage-root');
        if (state.scene === 'organize') root.innerHTML = renderOrganizeScene();
        else if (state.scene === 'settings') root.innerHTML = renderSettingsScene();
        else if (state.scene === 'autocomplete') root.innerHTML = renderAutocompleteScene();
        else if (state.scene === 'wikidoc') root.innerHTML = renderWikiDocScene();

        renderDiffModal();
        bindDynamicEvents();
        clampFloatingPopovers();
      }

      function pickAcCandidate(scope, idx) {
        if (scope === 'hud') {
          const m = matchAutocomplete(state.hudText, state.hudCursor);
          if (!m) return;
          const cands = filterCandidates(m.query);
          const picked = cands[idx];
          if (!picked) return;
          state.hudPrevText = state.hudText;
          const link = formatPickedLink(picked);
          state.hudText = state.hudText.slice(0, m.start) + link + state.hudText.slice(m.end);
          state.hudCursor = m.start + link.length;
          const extras = [];
          if (m.rawTrigger === '【【') extras.push('已将【【规范为 [[');
          if (m.absorbedClosing) extras.push('已吸收右侧闭合符');
          state.hudEscLog = `已插入 ${link}${extras.length ? `（${extras.join('，')}）` : ''}，可按 Ctrl+Z 一步回退`;
          toast(`已插入双链 ${link}`);
          render();
          const ta = document.getElementById('hud-sim-input');
          if (ta) { ta.focus(); ta.setSelectionRange(state.hudCursor, state.hudCursor); }
        } else {
          const m = matchAutocomplete(state.sourceText, state.srcCursor);
          if (!m) return;
          const cands = filterCandidates(m.query);
          const picked = cands[idx];
          if (!picked) return;
          const link = formatPickedLink(picked);
          state.sourceText = state.sourceText.slice(0, m.start) + link + state.sourceText.slice(m.end);
          state.srcCursor = m.start + link.length;
          toast(`源码已插入 ${link}`);
          render();
          const ta = document.getElementById('src-sim-input');
          if (ta) { ta.focus(); ta.setSelectionRange(state.srcCursor, state.srcCursor); }
        }
      }

        document.querySelectorAll('[data-revert-cs]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const cs = state.changesets.find((x) => x.id === btn.dataset.revertCs);
            if (!cs) return;
            // 子批次先撤拦截：行内持久展示提示，不随 Toast 消失
            const activeChild = state.changesets.find((x) => x.parentId === cs.id && x.status !== 'reverted');
            if (activeChild) {
              cs.revertBlockedNote = `请先撤销由本次待审确认生成的子整理记录（#${activeChild.id}），再撤销本批。`;
              cs.revertBlockedChildId = activeChild.id;
              state.highlightCsId = activeChild.id;
              toast(`请先撤销子整理记录 #${activeChild.id}`);
              render();
              return;
            }
            cs.revertBlockedNote = '';
            cs.revertBlockedChildId = null;

            // 严格按去重页面数（restored.length / keptModified.length）统计回滚
            const modifiedPaths = new Set(
              cs.ops.filter((op) => op.outcome === 'applied' && op.simulatedUserModified).map((op) => op.path)
            );
            const restoredPaths = new Set();
            const keptPages = new Map();
            cs.ops.forEach((op) => {
              if (op.outcome === 'applied') {
                if (modifiedPaths.has(op.path)) {
                  op.pageState = 'kept_modified';
                  keptPages.set(op.path, op.title);
                } else {
                  op.pageState = 'reverted';
                  restoredPaths.add(op.path);
                }
              } else if (op.outcome === 'pending_review') {
                op.outcome = 'discarded';
              }
            });
            // 同步清理本批次关联的所有待审项（含 pr-1、pr-2）
            state.pendingReviews = state.pendingReviews.filter((p) => p.changesetId !== cs.id);
            if (state.activeDiffId && !state.pendingReviews.some((p) => p.id === state.activeDiffId)) {
              state.activeDiffId = null;
            }

            const restoredCount = restoredPaths.size;
            const keptTitles = Array.from(keptPages.values()).map((t) => `《${t}》`);
            if (keptTitles.length > 0) {
              cs.status = 'partially_reverted';
              cs.rollbackNote = `已还原 ${restoredCount} 篇；${keptTitles.join('、')}因你后续手动修改，已原样保留。`;

              cs.status = 'reverted';
              cs.rollbackNote = `已还原本次涉及的 ${restoredCount} 篇页面并同步更新目录。`;

            // 若当前为子批次且已撤销，清除父批次的行内拦截提示
            if (cs.parentId) {
              const parentCs = state.changesets.find((x) => x.id === cs.parentId);
              if (parentCs && !state.changesets.some((x) => x.parentId === parentCs.id && x.status !== 'reverted')) {
                parentCs.revertBlockedNote = '';
                parentCs.revertBlockedChildId = null;
              }
            }
            render();
          });

        const hudInput = document.getElementById('hud-sim-input');
        if (hudInput) {

            state.hudText = hudInput.value;
            state.hudCursor = hudInput.selectionStart;
            state.hudAcDismissed = false;
            state.hudAcActiveIdx = 0;
            render();
            const ta = document.getElementById('hud-sim-input');
            if (ta) {
              const pos = typeof state.hudCursor === 'number' ? state.hudCursor : ta.value.length;
              ta.focus();
              ta.setSelectionRange(pos, pos);
            }
          });
          hudInput.addEventListener('click', () => {
            state.hudCursor = hudInput.selectionStart;
          });
          hudInput.addEventListener('keydown', (e) => {
            if (state.hudComposing) {
              if (e.key === 'Escape') {
                e.preventDefault();
                state.hudComposing = false;
                state.hudEscLog = '第 1 级触发：Esc 已交由中文输入法退出组词（窗口与补全未受干扰）';
                toast(state.hudEscLog);
                render();
              }
              return;
            }
            const curPos = hudInput.selectionStart;
            state.hudCursor = curPos;
            const m = matchAutocomplete(state.hudText, curPos);
            const cands = m && !state.hudAcDismissed ? filterCandidates(m.query) : [];
            if (cands.length > 0) {
              if (e.key === 'ArrowDown') {
                e.preventDefault();
                state.hudAcActiveIdx = (state.hudAcActiveIdx + 1) % cands.length;
                render();
                const ta = document.getElementById('hud-sim-input');
                if (ta) { ta.focus(); ta.setSelectionRange(curPos, curPos); }
                return;
              }
              if (e.key === 'ArrowUp') {
                e.preventDefault();
                state.hudAcActiveIdx = (state.hudAcActiveIdx - 1 + cands.length) % cands.length;
                render();
                const ta = document.getElementById('hud-sim-input');
                if (ta) { ta.focus(); ta.setSelectionRange(curPos, curPos); }
                return;
              }
              if ((e.key === 'Enter' || e.key === 'Tab') && !e.ctrlKey && !e.shiftKey) {
                e.preventDefault();
                pickAcCandidate('hud', state.hudAcActiveIdx);
                return;
              }
              if (e.key === 'Escape') {
                e.preventDefault();
                state.hudAcDismissed = true;
                state.hudEscLog = '第 2 级触发：仅关闭补全弹层，编辑器焦点与内容保持不变';
                toast(state.hudEscLog);
                render();
                const ta = document.getElementById('hud-sim-input');
                if (ta) { ta.focus(); ta.setSelectionRange(curPos, curPos); }
                return;
              }
            } else if (e.key === 'Escape') {
              e.preventDefault();
              if (!state.hudText.trim()) {
                state.hudEscLog = '第 3 级触发：草稿为空，直接收起随手记浮窗';
              } else {
                state.hudEscLog = '第 4 级触发：已落盘暂存草稿并收起浮窗（绝不误提交）';
              }
              toast(state.hudEscLog);
              render();
            }
            if (e.ctrlKey && e.key === 'Enter') {
              e.preventDefault();
              toast('Ctrl+Enter 穿透触发：已保存随手记并加入 60 秒合批队列');
            }
            if (e.ctrlKey && e.key.toLowerCase() === 'z' && state.hudPrevText) {
              e.preventDefault();
              state.hudText = state.hudPrevText;
              state.hudPrevText = '';
              state.hudCursor = null;
              state.hudAcDismissed = false;
              toast('Ctrl+Z 一步回退到补全前状态');
              render();
            }
          });
        }
        const hudUndo = document.getElementById('btn-hud-undo');
        if (hudUndo) {
          hudUndo.addEventListener('click', () => {
            state.hudText = state.hudPrevText;
            state.hudPrevText = '';

          });
        }
        const hudEscBtn = document.getElementById('btn-hud-sim-esc');
        if (hudEscBtn) {
          hudEscBtn.addEventListener('click', () => {
            state.hudEscLog = state.hudText.trim()
              ? '第 4 级触发：已保存草稿并收起浮窗，绝不误提交'
              : '第 3 级触发：空草稿直接收起浮窗';
            toast(state.hudEscLog);
            render();
          });
        }
        const hudSaveOnly = document.getElementById('btn-hud-save-only');
        if (hudSaveOnly) hudSaveOnly.addEventListener('click', () => toast('已仅保存为本地原文（raw/notes）'));
        const hudCommit = document.getElementById('btn-hud-commit');
        if (hudCommit) hudCommit.addEventListener('click', () => toast('已保存原文并加入 60 秒自动整理队列'));

        const srcInput = document.getElementById('src-sim-input');
        if (srcInput) {
          srcInput.addEventListener('input', () => {
            state.sourceText = srcInput.value;
            state.srcCursor = srcInput.selectionStart;
            state.sourceAcOpen = true;
            state.sourceAcActiveIdx = 0;
            render();
            const ta = document.getElementById('src-sim-input');
            if (ta) {
              const pos = typeof state.srcCursor === 'number' ? state.srcCursor : ta.value.length;
              ta.focus();
              ta.setSelectionRange(pos, pos);
            }
          });
          srcInput.addEventListener('click', () => {
            state.srcCursor = srcInput.selectionStart;
          });
        }
        const srcSave = document.getElementById('btn-src-save');
        if (srcSave) srcSave.addEventListener('click', () => toast('已保存 Markdown 源码（保留原文件 CRLF 换行符）'));

        document.querySelectorAll('[data-ac-pick]').forEach((btn) => {
          btn.addEventListener('mousedown', (e) => {
            e.preventDefault();
            const [scope, idxStr] = btn.dataset.acPick.split(':');
            pickAcCandidate(scope, Number(idxStr));
          });
        });

        // --- Scene 4 Events ---
        const docLintBadge = document.getElementById('btn-doc-lint-badge');
        if (docLintBadge) {
          docLintBadge.addEventListener('click', () => {
            state.lintPageFilter = { path: 'wiki/concepts/重试与退避策略.md', title: '重试与退避策略' };
            state.lintFilter = 'attention';
            state.scene = 'organize';
            toast('已跳转至整理中心并按《重试与退避策略》过滤体检项');
            render();
          });
        }
        const toggleCleanDoc = document.getElementById('btn-toggle-clean-doc');
        if (toggleCleanDoc) {
          toggleCleanDoc.addEventListener('click', () => {
            state.docBadgeMode = state.docBadgeMode === 'live'
              ? 'warn_only'
              : (state.docBadgeMode === 'warn_only' ? 'clean' : 'live');
            render();
          });
        }
        const toggleSplit = document.getElementById('btn-toggle-split');
        if (toggleSplit) {
          toggleSplit.addEventListener('click', () => {
            state.docSplitCite = state.docSplitCite ? null : 'w1';
            render();
          });
        }
        const closeSplit = document.getElementById('btn-close-split');
        if (closeSplit) {
          closeSplit.addEventListener('click', () => {
            state.docSplitCite = null;
            render();
          });
        }
        const ambigBtn = document.getElementById('btn-ambig-link');
        if (ambigBtn) {
          ambigBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            state.docDisambigOpen = !state.docDisambigOpen;
            state.docHoverCite = null;
            render();
          });
        }
        const disambigPop = document.querySelector('.disambig-popover');
        if (disambigPop) {
          disambigPop.addEventListener('click', (e) => e.stopPropagation());
        }
        const closeDisambig = document.getElementById('btn-close-disambig');
        if (closeDisambig) {
          closeDisambig.addEventListener('click', () => {
            state.docDisambigOpen = false;
            render();
          });
        }
        document.querySelectorAll('[data-pick-disambig]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const [path, label] = btn.dataset.pickDisambig.split('|');
            state.docDisambigOpen = false;
            toast(`已通过消歧浮层打开：${label}（${path}）`);
            render();
          });
        });
        const uniqueLink = document.getElementById('btn-unique-link');
        if (uniqueLink) {
          uniqueLink.addEventListener('click', () => toast('唯一命中：直接打开《网关限流设计》'));
        }

        // Footnote hover preview & click split
        document.querySelectorAll('[data-cite-wrap]').forEach((wrap) => {
          const key = wrap.dataset.citeWrap;
          wrap.addEventListener('mouseenter', () => {
            window.clearTimeout(hoverCloseTimer);
            if (state.docHoverCite !== key) {
              state.docHoverCite = key;
              state.docDisambigOpen = false;
              render();
            }
          });
          wrap.addEventListener('mouseleave', () => {
            hoverCloseTimer = window.setTimeout(() => {
              if (state.docHoverCite === key) {
                state.docHoverCite = null;
                render();
              }
            }, 160);
          });
        });
        document.querySelectorAll('[data-cite-btn]').forEach((btn) => {
          btn.addEventListener('click', () => {
            state.docSplitCite = btn.dataset.citeBtn;
            state.docHoverCite = null;
            render();
          });
          btn.addEventListener('focus', () => {
            if (state.docHoverCite !== btn.dataset.citeBtn) {
              state.docHoverCite = btn.dataset.citeBtn;
              render();
            }
          });
        });
        document.querySelectorAll('[data-open-split]').forEach((btn) => {
          btn.addEventListener('click', () => {
            state.docSplitCite = btn.dataset.openSplit;
            state.docHoverCite = null;
            toast('已打开原文分屏并自动定位至证据段');
            render();
          });
        });

        bindModalEvents();
      }

      function bindModalEvents() {
        const pr = state.pendingReviews.find((x) => x.id === state.activeDiffId);
        if (!pr) return;

        const closeBtn = document.getElementById('btn-close-diff');
        if (closeBtn) closeBtn.addEventListener('click', () => { state.activeDiffId = null; render(); });

        const simBtn = document.getElementById('btn-sim-vconflict');
        if (simBtn) {
          simBtn.addEventListener('click', () => {
            if (!pr.externallyModified) {
              pr.diskState = 'external_dirty';
              pr.externallyModified = true;
              pr.beforeLines = pr.externalBeforeLines.map((l) => ({ ...l }));
              toast('已模拟磁盘外部变动：已拦截写入，请重新检查或手动合并');
            } else if (pr.diskState === 'external_dirty') {
              pr.diskState = 'baseline';
              toast('演示状态：磁盘已模拟还原回原基线，请点击「重新检查文件状态」验证解锁');
            } else {
              pr.diskState = 'external_dirty';
              toast('演示状态：磁盘仍存在外部改动');
            }
            renderDiffModal();
            bindModalEvents();
          });
        }

        // B2: 重新检查文件状态（诚实闭环 + 同步更新 beforeLines）
        const recheckBtn = document.getElementById('btn-recheck-file-state');
        if (recheckBtn) {
          recheckBtn.addEventListener('click', () => {
            if (pr.diskState === 'baseline') {
              pr.externallyModified = false;
              pr.beforeLines = pr.baseBeforeLines.map((l) => ({ ...l }));
              toast('重新检查完成：磁盘文件已还原回原基线，已重新解锁「采纳写入」');
            } else {
              pr.externallyModified = true;
              let tagged = false;
              pr.beforeLines = pr.externalBeforeLines.map((l) => {
                if (!tagged && l.type === 'del') {
                  tagged = true;
                  const suffix = '（刚重新检查：磁盘仍与原基线不一致）';
                  return { ...l, text: l.text.includes(suffix) ? l.text : `${l.text}${suffix}` };
                }
                return { ...l };
              });
              toast('重新检查完成：磁盘仍存在外部改动，「采纳写入」保持禁用；请打开页面手动合并或丢弃此页改动');
            }
            renderDiffModal();
            bindModalEvents();
          });
        }

        const openManualMerge = () => {
          state.activeDiffId = null;
          state.docActiveTitle = pr.pageTitle;
          state.l2ActiveDocTitle = pr.pageTitle;
          state.scene = 'wikidoc';
          toast(`已打开《${pr.pageTitle}》，手动合并后可返回整理页丢弃本次待审改动`);
          render();
        };
        const manualMergeBtn = document.getElementById('btn-open-manual-merge');
        if (manualMergeBtn) manualMergeBtn.addEventListener('click', openManualMerge);
        const footerManualMergeBtn = document.getElementById('btn-footer-manual-merge');
        if (footerManualMergeBtn) footerManualMergeBtn.addEventListener('click', openManualMerge);

        const discardBtn = document.getElementById('btn-discard-review');
        if (discardBtn) {
          discardBtn.addEventListener('click', () => {
            const parent = state.changesets.find((c) => c.id === pr.changesetId);
            if (parent) {
              parent.ops.forEach((op) => {
                if (op.reviewId === pr.id) op.outcome = 'discarded';
              });
              if (!parent.ops.some((op) => op.outcome === 'pending_review')) parent.status = 'applied';
            }
            state.pendingReviews = state.pendingReviews.filter((x) => x.id !== pr.id);
            state.activeDiffId = null;
            toast(`已丢弃《${pr.pageTitle}》的待审改动`);
            render();
          });
        }

        // B4-4: 按原 op 类型生成子整理记录
        const applyBtn = document.getElementById('btn-apply-review');
        if (applyBtn) {
          applyBtn.addEventListener('click', () => {
            if (pr.externallyModified) return;
            const childId = `cs-sub-${Math.floor(100 + Math.random() * 899)}`;
            const parent = state.changesets.find((c) => c.id === pr.changesetId);
            if (parent) {
              parent.ops.forEach((op) => {
                if (op.reviewId === pr.id) {
                  op.outcome = 'applied';
                  op.pageState = 'applied';
                }
              });
              if (!parent.ops.some((op) => op.outcome === 'pending_review')) parent.status = 'applied';
            }
            state.changesets.unshift({
              id: childId,
              summary: `已采纳待审改动：《${pr.pageTitle}》（${pr.opTag}）`,
              time: '刚刚',
              trigger: '人工差异确认',
              modelAlias: 'gpt-4.1-mini',
              status: 'applied',
              parentId: pr.changesetId,
              droppedClaims: 0,
              rollbackNote: '',
              revertBlockedNote: '',
              revertBlockedChildId: null,
              ops: [
                { op: pr.op, tag: pr.opTag, tagClass: pr.opTagClass, title: pr.pageTitle, path: pr.pagePath, detail: pr.reasonLabel, outcome: 'applied', pageState: 'applied' },
              ],
            });
            state.pendingReviews = state.pendingReviews.filter((x) => x.id !== pr.id);
            state.activeDiffId = null;
            toast(`已写入《${pr.pageTitle}》并按「${pr.opTag}」生成关联子记录 #${childId}`);
            render();
          });
        }
      }

      // ======================================================================
      // Static Top Bar & Global Listeners
      // ======================================================================
      document.querySelectorAll('.p0-scene-tab').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.scene = btn.dataset.scene;
          render();
        });
      });
      document.querySelectorAll('.nav-item[data-rail-scene]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.scene = btn.dataset.railScene;
          render();
        });
      });
      const toggleTheme = () => {
        state.theme = state.theme === 'slate' ? 'paper' : 'slate';
        render();
      };
      document.getElementById('btn-theme-toggle').addEventListener('click', toggleTheme);
      document.getElementById('rail-theme-btn').addEventListener('click', toggleTheme);

      document.getElementById('btn-viewport-toggle').addEventListener('click', () => {
        state.narrow = !state.narrow;
        render();
      });

      document.getElementById('modal-layer').addEventListener('click', (e) => {
        if (e.target.id === 'modal-layer') {
          state.activeDiffId = null;
          render();
        }
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if (state.activeDiffId) {
            state.activeDiffId = null;
            render();
          } else if (state.docDisambigOpen || state.docHoverCite) {
            state.docDisambigOpen = false;
            state.docHoverCite = null;
            render();
          }
        }
      });

      window.addEventListener('click', () => {
        if (state.docDisambigOpen) {
          state.docDisambigOpen = false;
          render();
        }
      });

      render();
    })();
  </script>
</body>
</html>
