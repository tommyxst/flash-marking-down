[package]
name = "wikra"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[build-dependencies]
tauri-build = { version = "=2.7.5", features = [] }

[dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "native-tls", "system-proxy"] }
rusqlite = { version = "=0.43.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tauri = { version = "=2.12.6", features = ["tray-icon"] }

[target.'cfg(windows)'.dependencies]
tauri-plugin-dialog = { version = "=2.8.4", default-features = false }
